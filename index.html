<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tools</title>
<style>
:root{--bg:#f5f7f6;--surface:#fff;--fg:#16201c;--muted:#5a6762;--line:#d9e0dd;--accent:#0f6b59}
@media (prefers-color-scheme:dark){:root{--bg:#111514;--surface:#191e1c;--fg:#e7ece9;--muted:#95a39d;--line:#2d3532;--accent:#5cc4a9;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 16px;display:grid;gap:16px}
h1{margin:0;font-size:1.6rem}
a.tool{display:grid;gap:4px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;text-decoration:none}
a.tool:hover{border-color:var(--accent)}
a.tool strong{color:var(--accent);font-size:1.05rem}
.muted{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Tools</h1>
  <a class="tool" href="BTW-aangifte/">
    <strong>Btw-aangifte</strong>
    <span class="muted">Dutch VAT return from typed sales and purchase invoices: rubrics 1a–5g, checks, PDF records of filed returns.</span>
  </a>
</main>
</body>
</html>
