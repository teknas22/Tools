# Copy this file to config.ini and adjust. config.ini is git-ignored (it holds the SMTP password).

[app]
database = invoices.db
# 127.0.0.1 = only this PC. Use 0.0.0.0 to share on the office network (see README: security).
host = 127.0.0.1
port = 8080
company_name = My Company B.V.
currency = EUR
default_payment_terms_days = 30
default_vat_rate = 21
# Built-in scheduler: how often (minutes) the server checks for overdue invoices.
reminder_check_interval_minutes = 60

[reminders]
# While an invoice stays unpaid after its due date, repeat the message every N days.
repeat_every_days = 7
# Internal recipients (comma separated), e.g. finance / credit control.
notify_to = finance@mycompany.nl, credit.control@mycompany.nl
# true = also e-mail the overdue reminder to the invoice's contact e-mail (betalingsherinnering).
send_to_customer = false
# Every message is also appended here (works even without SMTP).
outbox_file = outbox.log

[smtp]
# Microsoft 365 example: smtp.office365.com / 587 / STARTTLS. Leave host empty to disable e-mail.
host =
port = 587
username =
password =
use_tls = true
from_address = invoices@mycompany.nl

[webhook]
# Optional Microsoft Teams (Workflows) or Slack incoming-webhook URL. Leave empty to disable.
url =
